<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5fb">
    <meta name="apple-itunes-app" content="app-id=6760519227">
    <title>Join me on LeanLine</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px; background: linear-gradient(145deg, #eef5ff, #f6efff 55%, #fff); color: #101114; }
      main { width: min(100%, 620px); padding: clamp(28px, 7vw, 48px); border: 1px solid rgba(0,0,0,.08); border-radius: 32px; background: rgba(255,255,255,.82); box-shadow: 0 24px 80px rgba(50,60,100,.14); backdrop-filter: blur(18px); }
      .eyebrow { display: flex; align-items: center; gap: 14px; }
      .mark { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 17px; color: white; font-size: 25px; font-weight: 900; background: linear-gradient(135deg, #1687ff, #7557ff); }
      h1 { margin: 0; font-size: 27px; letter-spacing: -.025em; }
      .subtitle { margin-top: 3px; color: #73757e; font-size: 17px; }
      .code { margin: 38px 0 12px; font: 900 clamp(46px, 12vw, 72px)/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; overflow-wrap: anywhere; }
      .hint { color: #73757e; font-size: 16px; line-height: 1.5; }
      .actions { display: grid; gap: 12px; margin-top: 34px; }
      a { display: flex; justify-content: center; padding: 15px 20px; border-radius: 999px; text-decoration: none; font-weight: 760; }
      .primary { color: white; background: #147df5; }
      .secondary { color: #147df5; background: rgba(20,125,245,.1); }
      .invalid { color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">
        <div class="mark">L</div>
        <div>
          <h1>Join me on LeanLine</h1>
          <div class="subtitle">Add me with code</div>
        </div>
      </div>
      <div class="code" id="code">••••••</div>
      <div class="hint" id="hint">Open LeanLine to connect and track progress together.</div>
      <div class="actions">
        <a class="primary" id="open-app" href="https://apps.apple.com/app/id6760519227">Open LeanLine</a>
        <a class="secondary" href="https://apps.apple.com/app/id6760519227">Download on the App Store</a>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("i") || "";
      const legacyCode = (params.get("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
      const codeNode = document.querySelector("#code");
      const hintNode = document.querySelector("#hint");
      const openNode = document.querySelector("#open-app");

      function showInvalid() {
        codeNode.textContent = "Invalid code";
        codeNode.classList.add("invalid");
        hintNode.textContent = "Ask your friend to send a new LeanLine invitation.";
        openNode.textContent = "Download LeanLine";
        openNode.href = "https://apps.apple.com/app/id6760519227";
      }

      async function resolveInvite() {
        const query = token
          ? `token=${encodeURIComponent(token)}`
          : `code=${encodeURIComponent(legacyCode)}`;

        if (!token && legacyCode.length !== 6) {
          showInvalid();
          return;
        }

        try {
          const response = await fetch(
            `https://oostcbbccmqlbgffgwrj.supabase.co/functions/v1/invite-link?${query}`,
            { headers: { "Accept": "application/json" } }
          );
          if (!response.ok) throw new Error("Invalid invitation");
          const result = await response.json();
          const code = String(result.code || "").toUpperCase();
          if (!/^[A-Z0-9]{6}$/.test(code)) throw new Error("Invalid code");

          codeNode.textContent = code;
          openNode.href = token
            ? `leanline://invite?i=${encodeURIComponent(token)}`
            : `leanline://invite?code=${encodeURIComponent(code)}`;
        } catch {
          showInvalid();
        }
      }

      resolveInvite();
    </script>
  </body>
</html>
