<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5fb">
  <meta name="description" content="Official support information for LeanLine">
  <title>Support · LeanLine</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f7fb; color: #17181c; }
    header { border-bottom: 1px solid #e4e6ec; background: rgba(255,255,255,.94); }
    nav { width: min(100% - 32px, 820px); margin: 0 auto; min-height: 58px; display: flex; align-items: center; gap: 20px; }
    nav a { color: #545966; font-weight: 650; text-decoration: none; }
    nav a:first-child { margin-right: auto; color: #15171b; font-size: 18px; font-weight: 800; }
    main { width: min(100% - 32px, 820px); margin: 32px auto 64px; padding: clamp(28px, 6vw, 58px); border: 1px solid #e4e6ec; border-radius: 24px; background: white; box-shadow: 0 18px 55px rgba(36,44,72,.08); }
    h1 { margin: 0; font-size: clamp(38px, 7vw, 56px); letter-spacing: -.045em; }
    p { color: #4b4f59; font-size: 18px; line-height: 1.65; }
    .contact { margin-top: 30px; padding: 24px; border-radius: 18px; background: #eef5ff; }
    .contact a { color: #0969da; font-weight: 750; }
    @media (max-width: 560px) { nav { gap: 12px; } nav a { font-size: 14px; } main { margin-top: 18px; border-radius: 18px; } }
  </style>
</head>
<body>
  <header><nav aria-label="Support navigation"><a href="/leanline/">LeanLine</a><a href="/leanline/privacy/">Privacy</a><a href="/leanline/terms/">Terms</a></nav></header>
  <main>
    <h1>LeanLine Support</h1>
    <p>Need help with the app, have a feature request, or found a bug? We’d love to hear from you.</p>
    <div class="contact"><p>Email <a href="mailto:LeanLine@163.com?subject=LeanLine%20Support">LeanLine@163.com</a> and include your device model, iOS version, and the steps that caused the issue.</p></div>
  </main>
</body>
</html>
