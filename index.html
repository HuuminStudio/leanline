<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5fb">
    <title>LeanLine</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(145deg, #eef5ff, #f6efff 55%, #fff); color: #101114; }
      main { width: min(100%, 560px); padding: 40px; border: 1px solid rgba(0,0,0,.08); border-radius: 30px; background: rgba(255,255,255,.78); box-shadow: 0 24px 80px rgba(50,60,100,.12); backdrop-filter: blur(18px); }
      .mark { width: 62px; height: 62px; display: grid; place-items: center; border-radius: 18px; color: white; font-size: 28px; font-weight: 900; background: linear-gradient(135deg, #1687ff, #7557ff); }
      h1 { margin: 24px 0 10px; font-size: clamp(34px, 8vw, 54px); letter-spacing: -.04em; }
      p { margin: 0; color: #686a73; font-size: 18px; line-height: 1.55; }
      a { display: inline-flex; margin-top: 28px; padding: 14px 20px; border-radius: 999px; color: white; background: #147df5; text-decoration: none; font-weight: 750; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">L</div>
      <h1>LeanLine</h1>
      <p>Track together. Progress together.</p>
      <a href="https://apps.apple.com/app/id6760519227">Download on the App Store</a>
    </main>
  </body>
</html>
